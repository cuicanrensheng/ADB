plugins {
    id 'com.android.application'
}
android {
    namespace "com.tv.adblog"
    compileSdk 34

    defaultConfig {
        applicationId "com.tv.adblog"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard‑android‑optimize.txt'), 'proguard‑rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // adblib 开源adb网络通信库（局域网adb，不需要ROOT）
    implementation 'com.tananaev:adb:2.1'
}
