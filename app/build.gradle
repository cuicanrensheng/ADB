plugins {
    id 'com.android.application' version '8.7.0'
}

android {
    namespace "com.tv.adblog"
    compileSdk 34

    defaultConfig {
        applicationId "com.tv.adblog"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 🔥 必须是 2.1，绝对不能带 v
    implementation 'com.github.tananaev:adb:2.1'
}
