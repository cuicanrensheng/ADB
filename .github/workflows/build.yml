name: 云编译ADB日志助手
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置JDK17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 🔥 关键修改点：把 8.7 改成了 8.9，和你的 gradle-wrapper.properties 保持一致
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      # 🔥 建议使用 ./gradlew 来确保 wrapper 生效，或者直接用 gradle 也可以
      - name: 编译Release包
        run: ./gradlew assembleRelease

      - name: 上传APK
        uses: actions/upload-artifact@v4
        with:
          name: ADB日志助手-APK
          path: app/build/outputs/apk/release/*.apk
