name: 云编译ADB日志助手
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置JDK17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      # 🔥 这里已经改成了 wget 下载压缩包，绝对不会再弹窗要求输入账号密码！
      - name: 下载并编译 adb 库源码
        run: |
          wget https://github.com/tananaev/adb/archive/refs/tags/v2.1.tar.gz
          tar -xzf v2.1.tar.gz
          cd adb-2.1
          ./gradlew jar
          mkdir -p ../app/libs
          cp build/libs/adb-*.jar ../app/libs/adb-2.1.jar
          cd ..

      - name: 编译Release包
        run: gradle assembleRelease

      - name: 上传APK
        uses: actions/upload-artifact@v4
        with:
          name: ADB日志助手-APK
          path: app/build/outputs/apk/release/*.apk
