name: 云编译ADB日志助手
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      # 自动生成Gradle Wrapper，解决缺少gradlew报错
      - name: 安装Gradle并生成wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: 设置JDK17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 赋予gradlew执行权限（Linux必须）
        run: chmod +x ./gradlew

      - name: Gradle编译Release包
        run: ./gradlew assembleRelease

      - name: 上传编译完成APK
        uses: actions/upload-artifact@v4
        with:
          name: ADB日志助手-APK
          path: app/build/outputs/apk/release/*.apk
